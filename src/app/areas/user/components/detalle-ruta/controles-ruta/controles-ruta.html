<div class="stack">
  <div>
    <label for="route-branch">Ramal</label
    ><select id="route-branch" [(ngModel)]="branch" (ngModelChange)="emit()">
      <option value="" disabled>Seleccione una opción</option>
      <option value="principal">[Nombre del ramal principal]</option>
      <option value="alterno">[Nombre del ramal alterno]</option>
    </select>
  </div>
  <fieldset>
    <legend>Sentido del recorrido</legend>
    <div class="radios">
      <label
        ><input
          type="radio"
          name="direction"
          value="Ida"
          [(ngModel)]="direction"
          (ngModelChange)="emit()"
        />Ida</label
      ><label
        ><input
          type="radio"
          name="direction"
          value="Regreso"
          [(ngModel)]="direction"
          (ngModelChange)="emit()"
        />Regreso</label
      >
    </div>
  </fieldset>
</div>
