<figure aria-label="Mapa de ejemplo del recorrido; no representa indicaciones reales">
  <span>Mapa (ejemplo)</span>
  <svg viewBox="0 0 356 220" role="img" aria-label="Recorrido ilustrativo con seis paradas">
    <defs>
      <pattern id="result-map-grid" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M44 0H0V44" fill="none" stroke="#c7d5d0" stroke-width="2" />
      </pattern>
    </defs>
    <rect width="356" height="220" fill="url(#result-map-grid)" />
    <polyline
      [attr.points]="points()"
      fill="none"
      stroke="var(--color-trayectico-primary)"
      stroke-width="5"
      stroke-linejoin="round"
    />
    @for (stop of stops(); track $index) {
      <circle
        [attr.cx]="stop[0]"
        [attr.cy]="stop[1]"
        r="6.5"
        fill="white"
        stroke="var(--color-trayectico-primary)"
        stroke-width="3"
      />
    }
  </svg>
</figure>
