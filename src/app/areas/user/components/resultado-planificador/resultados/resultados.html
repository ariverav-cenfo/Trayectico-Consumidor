<section aria-labelledby="options-title">
  <h2 id="options-title">Opciones de viaje</h2>
  <div class="options">
    @for (option of options(); track option.id) {
      <app-opciones-resultado [option]="option" [selected]="selectedId() === option.id" (choose)="choose.emit($event)" />
    }
  </div>
</section>
