<section aria-label="Opciones de viaje">
  <app-opciones-resultado>
    @for (option of options(); track option.id) {
      <button
        type="button"
        [attr.aria-pressed]="option.id === selectedId()"
        (click)="selectOption(option)"
      >
        <span class="option-route">{{ routeSummary(option) }}</span>

        <span class="option-transfers">
          @if (option.transbordos === 0) {
            Directo (sin transbordos)
          } @else if (option.transbordos === 1) {
            1 transbordo
          } @else {
            {{ option.transbordos }} transbordos
          }
        </span>

        <span class="option-walk">
          Caminata: {{ option.distancia_caminando_metros }} m
        </span>

        <span class="option-cost">
          @if (option.costo_total !== null && option.costo_total !== undefined) {
            {{ option.costo_total | currency:'CRC':'₡':'1.0-2' }}
          } @else {
            Tarifa no disponible
          }
        </span>
      </button>
    }
  </app-opciones-resultado>
</section>
