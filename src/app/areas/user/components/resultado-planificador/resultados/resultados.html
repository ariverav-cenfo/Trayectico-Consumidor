<section aria-label="Opciones de viaje">
  
@for (option of options(); track option.id) {
      <button
        type="button"
        [attr.aria-pressed]="option.id === selectedId()"
        (click)="selectOption(option)"
      >
        <span class="option-title">{{ optionTitle(option) }}</span>
        <span class="option-summary">{{ optionSummary(option) }}</span>
        <span class="option-price">
          @if (option.costo_total !== null && option.costo_total !== undefined) {
            {{ option.costo_total | currency:'CRC':'₡':'1.0-2' }}
          } @else {
            Tarifa no disponible
          }
        </span>
      </button>
    }
  
</section>
