<div class="stack">
  @for (route of visible(); track route.codigo_ruta) {
    <app-tarjeta-ruta [route]="route" />
  } @empty {
    <p class="muted" role="status">No se encontraron rutas con esa búsqueda.</p>
  }
</div>
@if (visible().length < routes().length) {
  <button
    appButton
    text="Cargar más rutas"
    class="load"
    type="button"
    (click)="loadMore()"
  ></button>
}
