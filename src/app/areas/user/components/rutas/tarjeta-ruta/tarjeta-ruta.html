<a class="card route-card" [routerLink]="['/rutas', route().codigo_ruta]">
  <h3>{{ route().codigo_ruta }} · {{ route().nombre_ruta }}</h3>
  <div class="row between">
    <div class="grow">
      <p class="muted">Tarifa no disponible</p>
      <div class="badges">
        @if (avisoActivo()) {
        <span class="badge warning"><app-ui-icon name="warning" />Aviso activo</span>
        }
      </div>
    </div>
    <app-ui-icon class="muted" name="chevron" />
  </div>
</a>
