<main>
  <h1>Historial de viajes</h1>
  <p class="intro">
    Sus viajes planificados se guardan automáticamente, del más reciente al más antiguo.
  </p>
  <p class="example">
    Historial de demostración guardado en este navegador. Los recorridos y tarifas son ejemplos.
  </p>
  <app-lista-viajes [trips]="history.trips()" (remove)="history.eliminar($event)" /><app-acciones-historial
    [hasTrips]="history.trips().length > 0"
    (clear)="history.limpiar()"
  />
</main>
