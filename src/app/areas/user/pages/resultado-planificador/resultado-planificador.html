<main>
  <a
    class="back"
    routerLink="/planificar"
    [queryParams]="paramsCambiarBusqueda()"
  ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8" /></svg>Cambiar búsqueda</a
  >
  <header class="results-heading">
    <h1>Resultados</h1>
    <p>
      {{ params().get('origin') || '[Origen]' }} a {{ params().get('destination') || '[Destino]' }}
    </p>
  </header>
  <app-resultados [options]="options()" [selectedId]="selected()?.id ?? ''" (choose)="choose($event)" />
  <app-mapa-resultado [points]="selected()?.points ?? ''" />
  <app-paso-a-paso [steps]="selected()?.steps ?? []" />
  <app-tarifa [price]="selected()?.price ?? ''" [payment]="selected()?.payment ?? ''" />
  <app-enlace-detalle-ruta [routeId]="selected()?.routeId ?? ''" />
  <footer>
    Datos: Consejo de Transporte Público (CTP), Visor de Rutas. Tarifas: ARESEP. La aplicación no
    incluye horarios ni frecuencias.
  </footer>
</main>
<app-ai-message />
