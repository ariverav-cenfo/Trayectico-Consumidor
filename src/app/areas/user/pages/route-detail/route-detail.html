<main>
  @if (current(); as route) {
    <app-route-heading [route]="route" />
    <p class="example">Recorrido, paradas y tarifas de ejemplo.</p>
    @if (activeAlert(); as alert) {
      <app-route-alert [alert]="alert" />
    }
    <app-route-controls (change)="controls.set($event)" /><app-result-map
      [points]="points()"
    /><app-route-stops [stops]="stops()" /><app-route-fares [route]="route" /><a
      appButton
      variant="primary"
      routerLink="/planificar"
      >Planificar un viaje</a
    ><app-data-footer />
  } @else {
    <h1>Ruta no encontrada</h1>
    <p class="muted">No hay información para esta ruta.</p>
    <a routerLink="/rutas" appButton>Volver a rutas</a>
  }
</main>
<app-ai-message />
